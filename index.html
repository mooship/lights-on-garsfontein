<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      (function() {
        try {
          var s = localStorage.getItem('theme');
          var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.add((s === 'dark' || (!s && d)) ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <title>Garsfontein Grid · Is the power on in Garsfontein, Pretoria?</title>
    <meta
      name="description"
      content="Is the power on in Garsfontein? Live status and a running record of power cuts in Garsfontein (Ward 45, Region 6, City of Tshwane), Pretoria, kept since 17 October 2026."
    />
    <link rel="canonical" href="https://garsfontein.timothybrits.co.za/" />
    <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121312" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Garsfontein Grid" />
    <meta property="og:locale" content="en_ZA" />
    <meta property="og:url" content="https://garsfontein.timothybrits.co.za/" />
    <meta property="og:title" content="Garsfontein Grid · Is the power on in Garsfontein?" />
    <meta
      property="og:description"
      content="Live power status and a running record of outages in Garsfontein, Pretoria."
    />
    <meta property="og:image" content="https://garsfontein.timothybrits.co.za/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Garsfontein Grid: current power status in Garsfontein, Pretoria" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Service",
        "name": "Garsfontein Grid",
        "alternateName": "Garsfontein power status",
        "description": "An open record of power cuts for homes on the Garsfontein substation in Pretoria, kept since 17 October 2026. Run by a local resident; not affiliated with the City of Tshwane or Eskom.",
        "url": "https://garsfontein.timothybrits.co.za/",
        "serviceType": "Power outage tracking",
        "areaServed": {
          "@type": "AdministrativeArea",
          "name": "Garsfontein, Ward 45, Pretoria",
          "containedInPlace": {
            "@type": "AdministrativeArea",
            "name": "Region 6, City of Tshwane",
            "containedInPlace": { "@type": "City", "name": "City of Tshwane" },
            "address": { "@type": "PostalAddress", "addressRegion": "Gauteng", "addressCountry": "ZA" }
          }
        },
        "availableChannel": {
          "@type": "ServiceChannel",
          "serviceUrl": "https://garsfontein.timothybrits.co.za/api/status"
        },
        "provider": {
          "@type": "Person",
          "name": "Timothy Brits",
          "description": "Garsfontein resident. Not affiliated with the City of Tshwane or Eskom."
        },
        "isAccessibleForFree": true
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static loading state. Mirrors src/components/Skeletons.tsx box for box (zero layout shift). -->
      <div class="gg-shell">
        <header class="gg-masthead">
          <div>
            <p class="gg-eyebrow">Ward 45 · Garsfontein, Pretoria</p>
            <h1 class="gg-title">Garsfontein Grid</h1>
          </div>
          <button type="button" class="gg-icon-button" aria-label="Switch theme" disabled></button>
        </header>
        <p class="gg-notice">Run by a Garsfontein resident. Not affiliated with the City of Tshwane or Eskom.</p>
        <main class="gg-main">
          <section class="gg-card gg-status-card">
            <p class="gg-sr-only">Loading the current status…</p>
            <div class="gg-skel-row" aria-hidden="true">
              <span class="gg-skel gg-skel-badge"></span>
              <span class="gg-skel-stack">
                <span class="gg-skel gg-skel-heading gg-w-60"></span>
                <span class="gg-skel gg-skel-text gg-w-30"></span>
              </span>
            </div>
            <div class="gg-status-detail" aria-hidden="true"><span class="gg-skel gg-skel-text gg-w-80"></span></div>
          </section>
          <section class="gg-card">
            <div class="gg-trends-body">
              <h2 class="gg-card-title">By the numbers</h2>
              <div class="gg-skel-stack" aria-hidden="true">
                <span class="gg-skel gg-skel-text gg-w-45"></span>
                <div class="gg-skel-grid">
                  <span class="gg-skel gg-skel-tile"></span>
                  <span class="gg-skel gg-skel-tile"></span>
                  <span class="gg-skel gg-skel-tile"></span>
                  <span class="gg-skel gg-skel-tile"></span>
                </div>
                <span class="gg-skel gg-skel-chart"></span>
              </div>
            </div>
            <details class="gg-trends-details">
              <summary>Show the weekly numbers</summary>
            </details>
          </section>
          <section class="gg-card">
            <h2 class="gg-card-title">Recent outages</h2>
            <div class="gg-skel-list" aria-hidden="true">
              <span class="gg-skel gg-skel-item"></span>
              <span class="gg-skel gg-skel-item"></span>
              <span class="gg-skel gg-skel-item"></span>
              <span class="gg-skel gg-skel-item"></span>
              <span class="gg-skel gg-skel-item"></span>
            </div>
          </section>
        </main>
      </div>
      <noscript><p class="gg-shell">Garsfontein Grid needs JavaScript. The live status is also available at /api/status.</p></noscript>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
