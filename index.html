<!doctype html>
<!-- The values in percent signs come from site.config.ts (siteConfig in vite.config.ts). Keep them
     out of the inline script: its CSP hash is in public/_headers. -->
<html lang="%site.locales.0%" data-locales="%site.locales%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      (function() {
        try {
          var h = document.documentElement;
          var s = localStorage.getItem('theme');
          var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
          h.classList.add((s === 'dark' || (!s && d)) ? 'dark' : 'light');
          // The shell below is in every language; base.css shows the one matching lang.
          var l = localStorage.getItem('locale');
          if (l && h.getAttribute('data-locales').split(' ').indexOf(l) >= 0) h.lang = l;
        } catch (e) {}
      })();
    </script>
    <title>%site.brand.full% · Is die krag aan in Garsfontein? Is the power on?</title>
    <meta
      name="description"
      content="Is die krag aan in Garsfontein? Intydse kragstatus en ’n deurlopende rekord van kragonderbrekings in Garsfontein, Pretoria (gemeet in Uitbreiding 16, Wyk 45, Streek 6, Stad Tshwane), sedert %since.af%. Live power status and a continuous record of power outages in Garsfontein, Pretoria (measured in Extension 16, Ward 45, Region 6, City of Tshwane), since %since.en%."
    />
    <link rel="canonical" href="%site.url%/" />
    <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121312" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/src/styles/base.css" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%site.brand.full%" />
    <!-- og:locale and og:locale:alternate are added from site.locales. -->
    <meta property="og:url" content="%site.url%/" />
    <meta property="og:title" content="%site.brand.full% · Is die krag aan in Garsfontein? Is the power on?" />
    <meta
      property="og:description"
      content="Intydse kragstatus en ’n deurlopende rekord van kragonderbrekings in Garsfontein, Pretoria. Live power status and a record of power outages in Garsfontein, Pretoria."
    />
    <meta property="og:image" content="%site.url%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%site.brand.short% Die huidige kragstatus in Garsfontein, Pretoria. Current power status." />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Service",
        "name": "%site.brand.full%",
        "alternateName": ["Garsfontein power status", "Garsfontein kragstatus"],
        "description": "’n Oop rekord van kragonderbrekings vir huise wat hul krag van die Garsfontein-substasie in Pretoria kry, bygehou sedert %since.af%. Onafhanklik bedryf deur ’n inwoner van Garsfontein. Nie verbonde aan die Stad Tshwane of Eskom nie. An open record of power outages for homes supplied by the Garsfontein substation in Pretoria, kept since %since.en%. Operated independently by a Garsfontein resident. Not affiliated with the City of Tshwane or Eskom.",
        "inLanguage": %site.locales%,
        "url": "%site.url%/",
        "serviceType": "Power outage tracking",
        "areaServed": {
          "@type": "AdministrativeArea",
          "name": "%site.area.name%",
          "containedInPlace": {
            "@type": "AdministrativeArea",
            "name": "%site.area.region%",
            "containedInPlace": { "@type": "City", "name": "%site.area.city%" },
            "address": { "@type": "PostalAddress", "addressRegion": "%site.area.province%", "addressCountry": "%site.area.country%" }
          }
        },
        "availableChannel": {
          "@type": "ServiceChannel",
          "serviceUrl": "%site.url%/api/status"
        },
        "provider": {
          "@type": "Person",
          "name": "%site.operator.name%",
          "description": "Resident of Garsfontein Extension 16. Not affiliated with the City of Tshwane or Eskom."
        },
        "isAccessibleForFree": true
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static loading state. Mirrors the app's masthead and src/components/Skeletons.tsx box for box
           (zero layout shift). The data-i18n* elements are filled from src/i18n in every language at
           build time (staticI18n in vite.config.ts). -->
      <div class="gg-shell">
        <header class="gg-masthead">
          <div>
            <p class="gg-eyebrow" data-i18n="masthead.eyebrow"></p>
            <h1 class="gg-title">%site.brand.short%</h1>
          </div>
          <div class="gg-masthead-actions">
            <button type="button" class="gg-icon-button gg-lang-button" data-i18n-switch data-i18n-label="lang.switchTo" disabled></button>
            <button type="button" class="gg-icon-button" data-i18n-label="theme.label" disabled></button>
          </div>
        </header>
        <p class="gg-notice" data-i18n="masthead.notice"></p>
        <main class="gg-main">
          <section class="gg-card gg-status-card">
            <p class="gg-sr-only" data-i18n="status.loading"></p>
            <div class="gg-skel-row" aria-hidden="true">
              <span class="gg-skel gg-skel-badge"></span>
              <span class="gg-skel-stack">
                <span class="gg-skel gg-skel-heading gg-w-60"></span>
                <span class="gg-skel gg-skel-text gg-w-30"></span>
              </span>
            </div>
            <div class="gg-status-detail" aria-hidden="true">
              <span class="gg-skel gg-skel-text gg-w-80"></span>
              <span class="gg-skel gg-skel-text gg-w-30"></span>
            </div>
          </section>
          <section class="gg-card">
            <div class="gg-trends-body">
              <h2 class="gg-card-title" data-i18n="trends.title"></h2>
              <div class="gg-skel-stack" aria-hidden="true">
                <span class="gg-skel gg-skel-text gg-w-45"></span>
                <div class="gg-skel-grid">
                  <span class="gg-skel gg-skel-tile"></span>
                  <span class="gg-skel gg-skel-tile"></span>
                  <span class="gg-skel gg-skel-tile"></span>
                  <span class="gg-skel gg-skel-tile"></span>
                </div>
                <span class="gg-skel gg-skel-chart"></span>
              </div>
            </div>
            <details class="gg-trends-details">
              <summary data-i18n="trends.tableLabel"></summary>
            </details>
          </section>
          <section class="gg-card">
            <h2 class="gg-card-title" data-i18n="history.title"></h2>
            <div class="gg-skel-list" aria-hidden="true">
              <span class="gg-skel gg-skel-item"></span>
              <span class="gg-skel gg-skel-item"></span>
              <span class="gg-skel gg-skel-item"></span>
              <span class="gg-skel gg-skel-item"></span>
              <span class="gg-skel gg-skel-item"></span>
            </div>
          </section>
        </main>
      </div>
      <noscript
        ><p class="gg-shell">
          Hierdie webwerf het JavaScript nodig. Die intydse status is ook by /api/status beskikbaar.
          <span lang="en">This site requires JavaScript. The live status is also available at /api/status.</span>
        </p></noscript
      >
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
