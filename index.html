<!doctype html>
<!-- The values in percent signs come from site.config.ts (siteConfig in vite.config.ts); the
     %page.…% ones differ per language page and come from src/i18n/head.ts (localePages). Keep them
     out of the inline script: its CSP hash is in public/_headers. The script spells out
     ADMIN_PAGE_PATH (shared/paths.ts) and the admin page's language (src/admin/copy.ts) as literals;
     change them together. -->
<html lang="%page.lang%" data-locales="%site.locales%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      (function() {
        var h = document.documentElement;
        // The admin page is always in English and never touches the stored choice; set before
        // anything that reads storage, which can throw.
        var admin = /^\/admin\/?$/.test(location.pathname);
        if (admin) h.lang = 'en';
        try {
          var s = localStorage.getItem('theme');
          var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
          h.classList.add((s === 'dark' || (!s && d)) ? 'dark' : 'light');
          // Language pages (shared/locale.ts) carry their own lang and the URL wins there; / forwards
          // a visitor who chose another language before anything renders. Other pages show the stored choice.
          var all = h.getAttribute('data-locales').split(' ');
          var l = localStorage.getItem('locale');
          var home = function(c) { return c === all[0] ? '/' : '/' + c + '/'; };
          if (admin || !l || all.indexOf(l) < 0) return;
          if (location.pathname !== home(h.lang)) h.lang = l;
          else if (h.lang === all[0] && l !== all[0]) {
            h.lang = l;
            location.replace(home(l) + location.search + location.hash);
          }
        } catch (e) {}
      })();
    </script>
    <title>%page.title%</title>
    <meta name="description" content="%page.description%" />
    <link rel="canonical" href="%page.url%" />
    %page.alternates%
    <!-- PALETTE.light.bg and PALETTE.dark.bg (src/styles/palette.ts); src/lib/theme.ts keeps them in step with the theme. -->
    <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121312" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="application/atom+xml" title="%site.brand.full%" href="/feed.xml" />
    <link rel="stylesheet" href="/src/styles/base.css" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%site.brand.full%" />
    %page.ogLocales%
    <meta property="og:url" content="%page.url%" />
    <meta property="og:title" content="%page.title%" />
    <meta property="og:description" content="%page.ogDescription%" />
    <meta property="og:image" content="%site.url%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%page.imageAlt%" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Service",
        "name": "%site.brand.full%",
        "alternateName": ["Garsfontein power status", "Garsfontein kragstatus"],
        "description": "%page.serviceDescription%",
        "inLanguage": %site.locales%,
        "url": "%site.url%/",
        "serviceType": "Power outage tracking",
        "areaServed": {
          "@type": "AdministrativeArea",
          "name": "%site.area.name%",
          "containedInPlace": {
            "@type": "AdministrativeArea",
            "name": "%site.area.region%",
            "containedInPlace": { "@type": "City", "name": "%site.area.city%" },
            "address": { "@type": "PostalAddress", "addressRegion": "%site.area.province%", "addressCountry": "%site.area.country%" }
          }
        },
        "availableChannel": {
          "@type": "ServiceChannel",
          "serviceUrl": "%site.url%/api/status"
        },
        "provider": {
          "@type": "Person",
          "name": "%site.operator.name%",
          "description": "Resident of Garsfontein Extension 16. Not affiliated with the City of Tshwane or Eskom."
        },
        "isAccessibleForFree": true
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static loading state. Mirrors the app's masthead, src/components/Skeletons.tsx and the
           status card's static rows (src/components/StatusNotes.tsx) box for box
           (zero layout shift). The data-i18n* elements are filled from src/i18n in every language at
           build time (staticI18n in vite.config.ts). -->
      <div class="gg-shell">
        <header class="gg-masthead">
          <p class="gg-eyebrow" data-i18n="masthead.eyebrow"></p>
          <div class="gg-masthead-actions">
            <button type="button" class="gg-icon-button gg-lang-button" data-i18n-switch data-i18n-label="lang.switchTo" disabled></button>
            <button type="button" class="gg-icon-button" data-i18n-label="theme.label" disabled></button>
          </div>
          <h1 class="gg-title">%site.brand.full%</h1>
        </header>
        <p class="gg-notice" data-i18n="masthead.notice"></p>
        <main class="gg-main">
          <section class="gg-card gg-status-card">
            <p class="gg-sr-only" data-i18n="status.loading"></p>
            <div class="gg-skel-row" aria-hidden="true">
              <span class="gg-skel gg-skel-badge"></span>
              <span class="gg-skel-stack">
                <span class="gg-skel gg-skel-heading gg-w-60"></span>
                <span class="gg-skel gg-skel-text gg-w-30"></span>
              </span>
            </div>
            <div>
              <p class="gg-scope" data-i18n="scope.measured" data-i18n-args="site.landmark"></p>
            </div>
            <div class="gg-status-detail" aria-hidden="true">
              <span class="gg-skel gg-skel-text gg-w-80"></span>
            </div>
            <p class="gg-safety"><span data-i18n="safety.live"></span> <a href="%site.faultReporting.url%" data-i18n="safety.report"></a>.</p>
          </section>
          <section class="gg-card">
            <div class="gg-trends-body">
              <h2 class="gg-card-title" data-i18n="trends.title"></h2>
              <div class="gg-skel-stack" aria-hidden="true">
                <span class="gg-skel gg-skel-text gg-w-45"></span>
                <div class="gg-skel-grid">
                  <span class="gg-skel gg-skel-tile"></span>
                  <span class="gg-skel gg-skel-tile"></span>
                  <span class="gg-skel gg-skel-tile"></span>
                  <span class="gg-skel gg-skel-tile"></span>
                </div>
                <span class="gg-skel gg-skel-chart"></span>
                <span class="gg-skel gg-skel-chart"></span>
              </div>
            </div>
            <details class="gg-trends-details">
              <summary data-i18n="trends.tableLabel"></summary>
            </details>
            <details class="gg-trends-details">
              <summary data-i18n="trends.howTitle"></summary>
            </details>
          </section>
          <section class="gg-card">
            <h2 class="gg-card-title" data-i18n="history.title"></h2>
            <div class="gg-skel-list" aria-hidden="true">
              <span class="gg-skel gg-skel-item"></span>
              <span class="gg-skel gg-skel-item"></span>
              <span class="gg-skel gg-skel-item"></span>
              <span class="gg-skel gg-skel-item"></span>
              <span class="gg-skel gg-skel-item"></span>
            </div>
          </section>
        </main>
      </div>
      <noscript
        ><p class="gg-shell">
          Hierdie webwerf het JavaScript nodig. Die status is ook by /api/status beskikbaar.
          <span lang="en">This site requires JavaScript. The status is also available at /api/status.</span>
        </p></noscript
      >
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
