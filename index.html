    <script>
      (function() {
        try {
          var s = localStorage.getItem('theme');
          var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.add((s === 'dark' || (!s && d)) ? 'dark' : 'light');
          if (localStorage.getItem('locale') !== 'en') return;
          // English: swap the shell's data-en* strings as the parser adds them, before the first paint.
          document.documentElement.lang = 'en';
          var o = new MutationObserver(function() {
            var els = document.querySelectorAll('[data-en],[data-en-label]');
            for (var i = 0; i < els.length; i++) {
              var e = els[i], v = e.getAttribute('data-en'), l = e.getAttribute('data-en-label');
              if (v !== null && e.textContent !== v) e.textContent = v;
              if (l !== null) e.setAttribute('aria-label', l);
              if (e.hasAttribute('data-en-lang')) e.lang = e.getAttribute('data-en-lang');
            }
          });
          o.observe(document.documentElement, { childList: true, subtree: true });
          document.addEventListener('DOMContentLoaded', function() { o.disconnect(); });
        } catch (e) {}
      })();
    </script>
