pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,tsx,json,css}"
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      run: npm run typecheck

pre-push:
  commands:
    test:
      run: npm test
