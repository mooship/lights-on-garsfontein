#:schema node_modules/wrangler/config-schema.json
# This deployment (Garsfontein Ext. 16). To run the app for another area, start from
# wrangler.example.toml, which has placeholders and the setup steps, and edit site.config.ts.
# Worker and D1 names keep the original slug: renaming the Worker would create a new one.
name = "garsfontein-grid"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
upload_source_maps = true
routes = [{ pattern = "garsfontein.timothybrits.co.za", custom_domain = true }]

[assets]
directory = "./dist"
binding = "ASSETS"
# Unknown paths get dist/404.html with status 404; the app's pages each have a file (vite.config.ts).
not_found_handling = "404-page"
# The same paths as API_PREFIX and WORKER_PAGES in shared/paths.ts; change them together.
run_worker_first = ["/api/*", "/sitemap.xml", "/robots.txt", "/og.png", "/feed.xml"]

[vars]
SITE_URL = "https://garsfontein.timothybrits.co.za"
TURNSTILE_SITE_KEY = "0x4AAAAAAFZLuwPL3UZam75R"

[[d1_databases]]
binding = "DB"
database_name = "garsfontein-grid"
database_id = "6374fa3a-827f-42f4-910f-8ff9415a1259"
migrations_dir = "drizzle"

# Workers Rate Limiting API. namespace_id must be unique per account.
#
# Per-connection limit on the public reads: status, statistics, CSV, feed and the push key.
[[ratelimits]]
name = "STATUS_LIMITER"
namespace_id = "4501"
simple = { limit = 60, period = 60 }

# Per-connection limit on the privacy page's contact button (/api/contact).
[[ratelimits]]
name = "CONTACT_LIMITER"
namespace_id = "4502"
simple = { limit = 5, period = 60 }

# Per-connection limit on sign-in attempts, which wrong bearer tokens share (worker/lib/auth.ts).
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "4503"
simple = { limit = 5, period = 60 }

# Site-wide cap on sign-in attempts, whatever address they come from.
[[ratelimits]]
name = "LOGIN_GLOBAL_LIMITER"
namespace_id = "4504"
simple = { limit = 30, period = 60 }

# Per-connection limit on push alert subscriptions (/api/push/subscription), the same as CONTACT_LIMITER.
[[ratelimits]]
name = "PUSH_LIMITER"
namespace_id = "4505"
simple = { limit = 5, period = 60 }

# Push alerts: the minute cron queues pages of subscriptions (worker/lib/alerts.ts) and the
# queue handler delivers them. One page per batch and no automatic retries: the handler retries
# itself, up to PUSH_MAX_ATTEMPTS. Create the queue once: npx wrangler queues create lights-on-push
[[queues.producers]]
binding = "PUSH_QUEUE"
queue = "lights-on-push"

[[queues.consumers]]
queue = "lights-on-push"
max_batch_size = 1
max_retries = 0

[triggers]
# Outage detection every minute; housekeeping (purging expired sessions) hourly.
# The same as MINUTE_CRON and HOURLY_CRON in worker/crons.ts; change them together.
crons = ["* * * * *", "0 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true

# Secrets (set with `wrangler secret put <NAME>`, see README):
# ADMIN_USERNAME, ADMIN_PASSWORD_HASH, ADMIN_API_TOKEN, HEARTBEAT_TOKEN, TURNSTILE_SECRET_KEY, CONTACT_EMAIL,
# VAPID_PRIVATE_KEY (npm run vapid-keys)

# The Playwright suite only (`wrangler dev --env e2e`, playwright.config.ts); never deployed. The
# suite loads the page far more often than a reader, so the status limit is out of its way.
# Bindings are not inherited by an environment, so each is repeated here. It must never reach
# production: no route, no workers.dev URL, no crons, and a local-only database id.
[env.e2e]
workers_dev = false
routes = []
triggers = { crons = [] }

[env.e2e.vars]
SITE_URL = "http://localhost:8787"
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"

[[env.e2e.d1_databases]]
binding = "DB"
database_name = "e2e-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle"

[[env.e2e.ratelimits]]
name = "STATUS_LIMITER"
namespace_id = "4511"
simple = { limit = 10000, period = 60 }

[[env.e2e.ratelimits]]
name = "CONTACT_LIMITER"
namespace_id = "4512"
simple = { limit = 10, period = 60 }

[[env.e2e.ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "4513"
simple = { limit = 5, period = 60 }

[[env.e2e.ratelimits]]
name = "LOGIN_GLOBAL_LIMITER"
namespace_id = "4514"
simple = { limit = 30, period = 60 }

[[env.e2e.ratelimits]]
name = "PUSH_LIMITER"
namespace_id = "4515"
simple = { limit = 10, period = 60 }

[[env.e2e.queues.producers]]
binding = "PUSH_QUEUE"
queue = "lights-on-push-e2e"

[[env.e2e.queues.consumers]]
queue = "lights-on-push-e2e"
max_batch_size = 1
max_retries = 0
